name: Daily DefiLlama snapshot and claims check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch DefiLlama endpoints
        run: python scripts/fetch_snapshot.py

      - name: Grade frozen claims
        run: python scripts/check_claims.py

      - name: Commit snapshot and claims results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/claims_results.json
          if git diff --staged --quiet; then
            echo "No snapshot or claims change to commit."
          else
            git commit -m "Update DefiLlama snapshot and claims results for $(date -u +%F)"
            git push
          fi
